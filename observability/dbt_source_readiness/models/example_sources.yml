version: 2

sources:
  - name: orchestration_observability
    database: OBSERVABILITY_PROD
    schema: AIRFLOW
    tables:
      - name: task_instance

  - name: payments
    database: ICEBERG_PROD
    schema: PAYMENTS
    tables:
      - name: payment_events
        identifier: PAYMENT_EVENTS
        data_tests:
          # Register the ICEBERG_PROD CLD check once. The remaining tables in
          # this CLD receive only the two table-level checks.
          - cld_catalog_link_status:
              config:
                severity: error
                store_failures: true

          - iceberg_auto_refresh_status:
              arguments:
                max_pending_snapshots: 0
              config:
                severity: error
                store_failures: true

          - airflow_task_freshness:
              arguments:
                airflow_relation: source('orchestration_observability', 'task_instance')
                validate_task_id: validate_payments_payment_events
                dag_ids:
                  - replay_payments_hourly
                  - replay_payments_daily
                validate_map_index: -1
                max_success_age_hours: 26
                lookback_hours: 72
              config:
                severity: error
                store_failures: true

      - name: settlement_status
        identifier: SETTLEMENT_STATUS
        data_tests:
          - iceberg_auto_refresh_status:
              arguments:
                max_pending_snapshots: 0
              config:
                severity: error
                store_failures: true

          - airflow_task_freshness:
              arguments:
                airflow_relation: source('orchestration_observability', 'task_instance')
                validate_task_id: validate_payments_settlement_status
                dag_ids:
                  - replay_payments_daily
                validate_map_index: -1
                max_success_age_hours: 26
              config:
                severity: error
                store_failures: true
